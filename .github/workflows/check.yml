name: Check monitored sources

on:
  schedule:
    # Active Launchpool only: every 10 minutes, offset from the hour.
    - cron: '2/10 * * * *'
    # Heavier page/article sources: once an hour.
    - cron: '3 * * * *'
  workflow_dispatch:
    inputs:
      test_source:
        description: 'Источник для одного реального тестового уведомления'
        required: false
        default: none
        type: choice
        options:
          - none
          - bitget-candybomb-current
          - bitget-launchpool
          - bitget-home-promotions-v2
          - bitget-current-promotions

permissions:
  contents: read

concurrency:
  group: telegram-monitor-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Select scheduled sources
        id: sources
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "enabled=all" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "3 * * * *" ]; then
            echo "enabled=bitget-candybomb-current,bitget-home-promotions-v2,bitget-current-promotions" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=bitget-launchpool" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect events
        env:
          TEST_SOURCE: ${{ inputs.test_source || 'none' }}
          ENABLED_SOURCES: ${{ steps.sources.outputs.enabled }}
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: node scripts/collect.js > /tmp/events.json
      - name: Trigger protected Vercel endpoint
        env:
          CHECK_URL: ${{ secrets.VERCEL_CHECK_URL }}
          CHECK_SECRET: ${{ secrets.CHECK_SECRET }}
        run: |
          test -n "$CHECK_URL"
          test -n "$CHECK_SECRET"
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $CHECK_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/events.json \
            "$CHECK_URL"
